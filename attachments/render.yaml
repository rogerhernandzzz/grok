services:
  - type: web
    name: skynet-api
    env: python
    region: ohio
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: skynet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_KEY
        sync: false

  - type: postgres
    name: skynet-db
    region: ohio
    plan: free
    version: 15
    ipAllowList: []

envVarGroups:
  - name: production
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

domains:
  - name: vamosportidiosdado
    type: web
    service: skynet-api
