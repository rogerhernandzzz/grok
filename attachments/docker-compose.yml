version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: skynet_db
    environment:
      POSTGRES_USER: skynet_user
      POSTGRES_PASSWORD: skynet_secure_password_123
      POSTGRES_DB: skynet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skynet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynet_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: .
    container_name: skynet_api
    environment:
      DATABASE_URL: postgresql://skynet_user:skynet_secure_password_123@db:5432/skynet
      JWT_SECRET: your_super_secret_jwt_key_here_change_in_production
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skynet_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Redis Cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: skynet_redis
    ports:
      - "6379:6379"
    networks:
      - skynet_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Proxy (opcional, para simular producción)
  nginx:
    image: nginx:alpine
    container_name: skynet_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - skynet_network

networks:
  skynet_network:
    driver: bridge

volumes:
  postgres_data:
